name: android-apk

# Builds debug APKs for testing on a phone: the default one, and the one with Netbird.
# Download them from the run's Artifacts section.
on:
  workflow_dispatch:
  push:
    branches: [ccr-30ee0e05-w78lcg]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install the Android NDK and platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build the default debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Keep the default APK aside
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/rexpocket-debug.apk

      - name: Build the Netbird library
        run: REXPOCKET_NETBIRD=1 sh tools/build-tailnet.sh

      - name: Build the debug APK with Netbird
        run: ./gradlew --no-daemon -Prexpocket.netbird=true :app:assembleDebug

      - name: Keep the Netbird APK aside
        run: cp app/build/outputs/apk/debug/app-debug.apk out/rexpocket-debug-netbird.apk

      - name: Sizes
        run: ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: rexpocket-debug-apks
          path: out/*.apk
          if-no-files-found: error

  device-test:
    # The arm64 Linux runner is free for public repositories, and KVM lets an arm64 emulator run at
    # full speed. The native Netbird library is arm64 only, so the test cannot run on an x86 emulator.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Allow KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          # Report what this runner offers, so a missing KVM is visible in the log.
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"

      - name: Install the Android NDK, platform and emulator image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "system-images;android-35;google_apis;arm64-v8a" \
            "emulator" "platform-tools" "build-tools;36.1.0" "platforms;android-36" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build the Netbird library
        run: REXPOCKET_NETBIRD=1 sh tools/build-tailnet.sh

      - name: Run the on-device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          script: >-
            ./gradlew --no-daemon -Prexpocket.netbird=true :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=me.leaver.rexpocket.net.TailnetNodeInstrumentedTest

      - name: Keep the test reports
        if: always()
        run: |
          mkdir -p out
          cp -r app/build/reports/androidTests out/ 2>/dev/null || true
          cp -r app/build/outputs/androidTest-results out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: out/
          if-no-files-found: warn
