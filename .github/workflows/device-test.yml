name: device-test

# Runs the instrumented tests (app/src/androidTest) on an x86_64 emulator. The app ships arm64-v8a
# native code only; the x86_64 Android 11+ images translate ARM code (native bridge), which is what
# lets the arm64 APK install and load its libraries here.
on:
  workflow_dispatch:
  push:
    branches: [ccr-30ee0e05-w78lcg]

permissions:
  contents: read

jobs:
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 31, 33, 34, 35]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Allow KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install the Android NDK and platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build the Netbird library
        run: REXPOCKET_NETBIRD=1 sh tools/build-tailnet.sh

      - name: Build the app and test APKs
        run: ./gradlew --no-daemon -Prexpocket.netbird=true :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Write the test script
        # Each class runs on its own, so a native crash in one does not hide the results of the rest.
        run: |
          cat > "$RUNNER_TEMP/run-tests.sh" <<'SH'
          set -u
          adb shell getprop ro.product.cpu.abilist
          adb shell getprop ro.dalvik.vm.native.bridge
          adb shell getprop ro.build.version.sdk
          mkdir -p out
          status=0
          for class in \
              me.leaver.rexpocket.net.TailnetNodeInstrumentedTest \
              me.leaver.rexpocket.data.FontPreferenceTest \
              me.leaver.rexpocket.ui.TerminalImeTest \
              me.leaver.rexpocket.ui.TerminalViewTest; do
            adb logcat -c || true
            if ./gradlew --no-daemon -q -Prexpocket.netbird=true :app:connectedDebugAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.class="$class"; then
              echo "RESULT $class: passed"
            else
              echo "RESULT $class: FAILED"
              status=1
            fi
            mkdir -p "out/$class"
            cp -r app/build/reports/androidTests "out/$class/" 2>/dev/null || true
            cp -r app/build/outputs/androidTest-results "out/$class/" 2>/dev/null || true
            adb logcat -d > "out/$class/logcat.txt" || true
            grep -E "ndk_translation|SIGILL|SIGSEGV|Fatal signal|FATAL EXCEPTION|UnsatisfiedLinkError" "out/$class/logcat.txt" | head -20 || true
          done
          exit $status
          SH

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh "$RUNNER_TEMP/run-tests.sh"

      - name: Keep the test reports
        if: always()
        run: |
          mkdir -p out
          cp -r app/build/reports/androidTests out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api${{ matrix.api-level }}
          path: out/
          if-no-files-found: warn
