name: device-test

# Runs the instrumented tests (app/src/androidTest) on an x86_64 emulator. The app ships arm64-v8a
# native code only; the x86_64 Android 11+ images translate ARM code (native bridge), which is what
# lets the arm64 APK install and load its libraries here.
on:
  workflow_dispatch:
  push:
    branches: [ccr-30ee0e05-w78lcg]

permissions:
  contents: read

jobs:
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        api-level: [30]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Allow KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install the Android NDK and platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build the Netbird library
        run: REXPOCKET_NETBIRD=1 sh tools/build-tailnet.sh

      - name: Build the app and test APKs
        run: ./gradlew --no-daemon -Prexpocket.netbird=true :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell getprop ro.product.cpu.abilist
            adb shell getprop ro.dalvik.vm.native.bridge
            adb shell getprop ro.build.version.sdk
            ./gradlew --no-daemon -Prexpocket.netbird=true :app:connectedDebugAndroidTest || (adb logcat -d > logcat.txt; exit 1)
            adb logcat -d > logcat.txt

      - name: Keep the test reports
        if: always()
        run: |
          mkdir -p out
          cp -r app/build/reports/androidTests out/ 2>/dev/null || true
          cp -r app/build/outputs/androidTest-results out/ 2>/dev/null || true
          cp logcat.txt out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api${{ matrix.api-level }}
          path: out/
          if-no-files-found: warn
