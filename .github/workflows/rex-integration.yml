name: rex-integration

# The core tests, with the pane lifecycle scenarios: tabs and panes closed on the desk or on the
# phone, release and take over, reconnects. They run against ScriptedRex, a Rex speaking the
# control and data protocols in the test JVM. A real Rex cannot run here: its Linux server build is
# downloaded only after signing in to the beta, and it is not redistributable. The same scenarios
# run against a real Rex on a computer that has one; see docs/design/testing.md.
on:
  workflow_dispatch:
  push:
    branches: [ccr-30ee0e05-w78lcg]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Core tests and Rex scenarios
        run: ./gradlew --no-daemon :core:test

      - name: Scenario results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob('core/build/test-results/test/*Lifecycle*.xml')):
              for case in ET.parse(f).getroot().iter('testcase'):
                  verdict = 'failed' if case.find('failure') is not None else 'skipped' if case.find('skipped') is not None else 'passed'
                  print(f"{case.get('classname').rsplit('.', 1)[-1]}.{case.get('name')}: {verdict}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-reports
          path: core/build/reports/tests/test
          if-no-files-found: ignore
